name: Code Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall -q app scripts run.py

      - name: Import application modules
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          failures = []
          package = importlib.import_module("app")
          for module in pkgutil.walk_packages(package.__path__, package.__name__ + "."):
              try:
                  importlib.import_module(module.name)
              except Exception as exc:
                  failures.append(f"{module.name}: {type(exc).__name__}: {exc}")
          importlib.import_module("run")
          if failures:
              print("Module import failures:")
              for failure in failures:
                  print(f"  - {failure}")
              raise SystemExit(1)
          print("All application modules imported successfully.")
          PY

      - name: Validate Telegram client construction
        run: |
          python - <<'PY'
          from aiogram import Bot
          from pyrogram import Client
          bot_token = "123456:TEST_TOKEN"
          client = Client("ci_test", api_id=123456, api_hash="test_api_hash", bot_token=bot_token, in_memory=True)
          bot = Bot(token=bot_token)
          print("Pyrogram client:", type(client).__name__)
          print("aiogram bot:", type(bot).__name__)
          print("Telegram client construction test passed.")
          PY

      - name: Validate Eporner API
        run: |
          python - <<'PY'
          import eporner_api
          print("Eporner API imported:", eporner_api.__name__)
          PY

      - name: Check required system tools
        run: |
          command -v ffmpeg >/dev/null 2>&1 || echo "WARNING: ffmpeg is not installed."
          command -v aria2c >/dev/null 2>&1 || echo "WARNING: aria2c is not installed."

      - name: Validate configuration defaults
        run: |
          python - <<'PY'
          import os
          os.environ["BOT_TOKEN"] = "123456:TEST_TOKEN"
          os.environ["TELEGRAM_API_ID"] = "123456"
          os.environ["TELEGRAM_API_HASH"] = "test_api_hash"
          from app.config.settings import Settings
          settings = Settings()
          assert settings.bot_token == "123456:TEST_TOKEN"
          assert settings.telegram_api_id == 123456
          assert settings.telegram_api_hash == "test_api_hash"
          assert settings.max_telegram_file_size == 2 * 1024**3
          print("Configuration validation passed.")
          PY
